<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blake Hydraulics Sales Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f7fa;--bg-tertiary:#eef1f6;
  --text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;
  --border-light:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.18);
  --accent:#1d4ed8;--accent-light:#eff6ff;--accent-dark:#1e3a8a;
  --success-bg:#f0fdf4;--success-text:#166534;--success-border:#bbf7d0;
  --warn-bg:#fffbeb;--warn-text:#92400e;--warn-border:#fde68a;
  --danger-bg:#fef2f2;--danger-text:#991b1b;--danger-border:#fecaca;
  --info-bg:#eff6ff;--info-text:#1e40af;--info-border:#bfdbfe;
  --purple-bg:#f5f3ff;--purple-text:#4c1d95;
  --teal-bg:#f0fdfa;--teal-text:#134e4a;
  --radius-md:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#1a1a1a;--bg-secondary:#242424;--bg-tertiary:#2e2e2e;
  --text-primary:#f3f4f6;--text-secondary:#9ca3af;--text-tertiary:#6b7280;
  --border-light:rgba(255,255,255,0.08);--border-mid:rgba(255,255,255,0.15);
  --accent:#3b82f6;--accent-light:#1e3a5f;--accent-dark:#93c5fd;
  --success-bg:#052e16;--success-text:#86efac;--success-border:#166534;
  --warn-bg:#2d1a00;--warn-text:#fcd34d;--warn-border:#92400e;
  --danger-bg:#2d0a0a;--danger-text:#fca5a5;--danger-border:#991b1b;
  --info-bg:#0f2240;--info-text:#93c5fd;--info-border:#1e3a8a;
  --purple-bg:#2d1b5e;--purple-text:#c4b5fd;
  --teal-bg:#042f2e;--teal-text:#5eead4;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg-tertiary);color:var(--text-primary);min-height:100vh}
.shell{max-width:1100px;margin:0 auto;padding:24px 20px}
.header{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-size:16px;font-weight:600;color:var(--text-primary)}
.brand-name span{font-weight:400;color:var(--text-secondary)}
.user-switcher{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-switcher label{font-size:12px;color:var(--text-secondary)}
select,input,textarea{background:var(--bg-primary);color:var(--text-primary);border:0.5px solid var(--border-mid);border-radius:var(--radius-md);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
select{padding:5px 8px;height:32px;cursor:pointer}
.role-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:500}
.role-admin{background:var(--purple-bg);color:var(--purple-text)}
.role-user{background:var(--bg-secondary);color:var(--text-secondary);border:0.5px solid var(--border-light)}
.card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:20px}
.tabs{display:flex;gap:2px;border-bottom:0.5px solid var(--border-light);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:13px;font-weight:500;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;display:inline-flex;align-items:center;gap:6px;transition:color .15s}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--text-primary);border-bottom-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{padding:6px 10px;height:32px;width:180px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);transition:background .15s;font-family:inherit}
.btn:hover{background:var(--bg-secondary)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.tbl-wrap{overflow-x:auto;border:0.5px solid var(--border-light);border-radius:var(--radius-lg)}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
thead tr{background:var(--bg-secondary)}
th{padding:10px 10px;text-align:left;font-weight:500;color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:0.5px solid var(--border-light);white-space:nowrap;overflow:hidden}
td{padding:10px 10px;border-bottom:0.5px solid var(--border-light);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-secondary)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:500}
.b-blue{background:var(--info-bg);color:var(--info-text)}
.b-green{background:var(--success-bg);color:var(--success-text)}
.b-amber{background:var(--warn-bg);color:var(--warn-text)}
.b-coral{background:var(--danger-bg);color:var(--danger-text)}
.b-gray{background:var(--bg-secondary);color:var(--text-secondary);border:0.5px solid var(--border-light)}
.b-purple{background:var(--purple-bg);color:var(--purple-text)}
.b-teal{background:var(--teal-bg);color:var(--teal-text)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg-secondary);border-radius:var(--radius-md);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.kpi-val{font-size:22px;font-weight:600;color:var(--text-primary)}
.section-hd{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.funnel{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.funnel-stage{flex:1;min-width:90px;background:var(--bg-secondary);border-radius:var(--radius-md);padding:12px;text-align:center;border:0.5px solid var(--border-light)}
.funnel-label{font-size:10px;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.funnel-val{font-size:18px;font-weight:600;color:var(--text-primary)}
.funnel-sub{font-size:10px;color:var(--text-secondary);margin-top:3px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stage-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border-light)}
.stage-row:last-child{border-bottom:none}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rep-card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.rep-info{flex:1;min-width:0}
.rep-name{font-size:14px;font-weight:500}
.rep-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.rep-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-md);border:0.5px solid var(--border-light);background:none;cursor:pointer;color:var(--text-secondary);font-size:15px;transition:all .15s}
.icon-btn:hover{background:var(--bg-secondary);color:var(--text-primary)}
.icon-btn.del:hover{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}
.icon-btn:disabled{opacity:.28;cursor:not-allowed;pointer-events:none}
.pipe-footer{margin-top:10px;padding:10px 16px;background:var(--bg-secondary);border-radius:var(--radius-md);display:flex;gap:2rem;font-size:13px;flex-wrap:wrap;border:0.5px solid var(--border-light)}
.lock-notice{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);padding:5px 10px;background:var(--bg-secondary);border-radius:var(--radius-md);border:0.5px solid var(--border-light)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-primary);border:0.5px solid var(--border-mid);border-radius:var(--radius-lg);padding:24px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:7px 10px;font-size:13px}
.form-row textarea{height:72px;resize:vertical}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:0.5px solid var(--border-light)}
.confirm-box{background:var(--danger-bg);border:0.5px solid var(--danger-border);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;font-size:13px;color:var(--danger-text);line-height:1.5}
.btn-danger{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}
.btn-danger:hover{opacity:.85}
.empty{text-align:center;padding:3rem;color:var(--text-secondary);font-size:13px}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.form-2{grid-template-columns:1fr}.shell{padding:12px}}
</style>
</head>
<body>
<div class="shell">

<div class="header">
  <div class="brand">
    <i class="ti ti-droplet" style="font-size:22px;color:var(--accent)"></i>
    <div>
      <div class="brand-name">Blake Hydraulics <span>Sales Tracker</span></div>
    </div>
  </div>
  <div class="user-switcher">
    <label>Logged in as:</label>
    <select id="user-select" onchange="switchUser()">
      <option value="admin">Admin user</option>
      <option value="rep1">John Smith (rep)</option>
      <option value="rep2">Sarah Naidoo (rep)</option>
    </select>
    <span id="role-badge" class="role-pill role-admin"><i class="ti ti-shield"></i> Admin</span>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')"><i class="ti ti-chart-bar"></i> Dashboard</button>
    <button class="tab" onclick="switchTab('activity')"><i class="ti ti-calendar"></i> Activity log</button>
    <button class="tab" onclick="switchTab('pipeline')"><i class="ti ti-arrow-right"></i> Pipeline</button>
    <button class="tab" onclick="switchTab('reps')"><i class="ti ti-users"></i> Reps</button>
  </div>

  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="panel active"><div id="dash-content"></div></div>

  <!-- ACTIVITY -->
  <div id="tab-activity" class="panel">
    <div class="toolbar">
      <input type="text" id="act-search" placeholder="Search…" oninput="renderActivity()">
      <select id="act-rep" onchange="renderActivity()"><option value="">All reps</option></select>
      <select id="act-type" onchange="renderActivity()"><option value="">All types</option></select>
      <button class="btn primary" onclick="openModal('activity')"><i class="ti ti-plus"></i> Log activity</button>
    </div>
    <div class="tbl-wrap"><table>
      <colgroup><col style="width:90px"><col style="width:110px"><col style="width:130px"><col style="width:145px"><col style="width:98px"><col style="width:170px"><col style="width:62px"><col style="width:90px"><col style="width:90px"><col style="width:155px"></colgroup>
      <thead><tr><th>Date</th><th>Rep</th><th>Customer</th><th>Company</th><th>Type</th><th>Purpose</th><th>Mins</th><th>Follow-up?</th><th>F/U date</th><th>Outcome</th></tr></thead>
      <tbody id="act-body"></tbody>
    </table></div>
  </div>

  <!-- PIPELINE -->
  <div id="tab-pipeline" class="panel">
    <div class="toolbar">
      <input type="text" id="pipe-search" placeholder="Search…" oninput="renderPipeline()">
      <select id="pipe-rep" onchange="renderPipeline()"><option value="">All reps</option></select>
      <select id="pipe-stage" onchange="renderPipeline()"><option value="">All stages</option></select>
      <button class="btn primary" onclick="openModal('pipeline')"><i class="ti ti-plus"></i> Add deal</button>
      <span id="pipe-lock-notice" class="lock-notice" style="display:none"><i class="ti ti-lock"></i> Only admins can delete deals</span>
    </div>
    <div class="tbl-wrap"><table>
      <colgroup><col style="width:96px"><col style="width:124px"><col style="width:136px"><col style="width:160px"><col style="width:104px"><col style="width:100px"><col style="width:66px"><col style="width:106px"><col style="width:90px"><col style="width:74px"><col style="width:38px"></colgroup>
      <thead><tr><th>Rep</th><th>Customer</th><th>Company</th><th>Opportunity</th><th>Stage</th><th>Value (R)</th><th>Prob %</th><th>Weighted (R)</th><th>Close date</th><th>Status</th><th></th></tr></thead>
      <tbody id="pipe-body"></tbody>
    </table></div>
    <div class="pipe-footer">
      <span>Total pipeline: <strong id="pipe-total"></strong></span>
      <span>Weighted: <strong id="pipe-weighted"></strong></span>
      <span>Deals shown: <strong id="pipe-count"></strong></span>
    </div>
  </div>

  <!-- REPS -->
  <div id="tab-reps" class="panel">
    <div class="toolbar">
      <input type="text" id="rep-search" placeholder="Search reps…" oninput="renderReps()">
      <button id="add-rep-btn" class="btn primary" onclick="openModal('rep')"><i class="ti ti-plus"></i> Add rep</button>
      <span id="rep-lock-notice" class="lock-notice" style="display:none"><i class="ti ti-lock"></i> Only admins can add or remove reps</span>
    </div>
    <div class="rep-grid" id="rep-grid"></div>
  </div>
</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeMO(event)">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="modal-save-btn" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
const TYPES=["Site Visit","Phone Call","Video Call","Email","Trade Show","Demo"];
const STAGES=["Qualified","Quote","Quote Sent","Approved","PO Received","Closed Won","Closed Lost"];
const SC={"Qualified":"b-blue","Quote":"b-amber","Quote Sent":"b-purple","Approved":"b-teal","PO Received":"b-green","Closed Won":"b-green","Closed Lost":"b-coral"};
const DP={"Qualified":20,"Quote":35,"Quote Sent":50,"Approved":75,"PO Received":90,"Closed Won":100,"Closed Lost":0};
const AV_BG=["#eff6ff","#f0fdf4","#fffbeb","#fef2f2"];
const AV_TX=["#1e40af","#166534","#92400e","#991b1b"];

const USERS={admin:{name:"Admin",role:"admin"},rep1:{name:"John Smith",role:"rep"},rep2:{name:"Sarah Naidoo",role:"rep"}};
let currentUser=USERS.admin;
function isAdmin(){return currentUser.role==='admin'}

let reps=[
  {id:1,name:"John Smith",title:"External Sales Rep",territory:"KZN North",email:"john@blakehydraulics.co.za",phone:"082 111 2233"},
  {id:2,name:"Sarah Naidoo",title:"External Sales Rep",territory:"KZN South & EC",email:"sarah@blakehydraulics.co.za",phone:"083 444 5566"},
];
let nextRepId=3;

let activities=[
  {id:1,date:"2026-05-06",rep:"John Smith",customer:"Mike Dlamini",company:"Durban Hydraulics",type:"Site Visit",purpose:"Demo of new cylinder range",mins:90,followup:"Yes",fudate:"2026-05-13",outcome:"Interested – requested quote"},
  {id:2,date:"2026-05-07",rep:"Sarah Naidoo",customer:"Raj Pillay",company:"KZN Mining Supplies",type:"Phone Call",purpose:"Follow up on repair quote",mins:20,followup:"No",fudate:"",outcome:"Quote accepted – PO expected"},
  {id:3,date:"2026-05-08",rep:"John Smith",customer:"Amanda Coetzee",company:"PE Plant Hire",type:"Video Call",purpose:"Qualify new prospect",mins:45,followup:"Yes",fudate:"2026-05-15",outcome:"Warm lead – budget Q3"},
  {id:4,date:"2026-05-09",rep:"Sarah Naidoo",customer:"Dave Hendricks",company:"Cape Town Industrial",type:"Site Visit",purpose:"Post-delivery check",mins:30,followup:"No",fudate:"",outcome:"Satisfied, referral offered"},
  {id:5,date:"2026-05-10",rep:"John Smith",customer:"Tumi Mokoena",company:"Jhb Earthmoving",type:"Phone Call",purpose:"Schedule site visit",mins:15,followup:"Yes",fudate:"2026-05-17",outcome:"Visit confirmed"},
];
let nextActId=6;

let deals=[
  {id:1,rep:"John Smith",customer:"Mike Dlamini",company:"Durban Hydraulics",opportunity:"Cylinder Repair Contract",stage:"Quote Sent",value:85000,prob:50,close:"2026-05-30",status:"Active"},
  {id:2,rep:"Sarah Naidoo",customer:"Raj Pillay",company:"KZN Mining Supplies",opportunity:"Hydraulic Pump Supply x4",stage:"PO Received",value:42000,prob:90,close:"2026-05-20",status:"Active"},
  {id:3,rep:"John Smith",customer:"Amanda Coetzee",company:"PE Plant Hire",opportunity:"Service Level Agreement",stage:"Qualified",value:120000,prob:20,close:"2026-08-01",status:"Active"},
  {id:4,rep:"Sarah Naidoo",customer:"Dave Hendricks",company:"Cape Town Industrial",opportunity:"Hose Assembly Order",stage:"Closed Won",value:18500,prob:100,close:"2026-05-02",status:"Won"},
  {id:5,rep:"John Smith",customer:"Tumi Mokoena",company:"Jhb Earthmoving",opportunity:"Cylinder Overhaul x6",stage:"Quote",value:65000,prob:35,close:"2026-06-30",status:"Active"},
];
let nextDealId=6;

let modalMode='';let targetId=null;

function switchUser(){
  currentUser=USERS[document.getElementById('user-select').value];
  const b=document.getElementById('role-badge');
  if(isAdmin()){b.className='role-pill role-admin';b.innerHTML='<i class="ti ti-shield"></i> Admin';}
  else{b.className='role-pill role-user';b.innerHTML='<i class="ti ti-user"></i> Rep';}
  const tabs=['dashboard','activity','pipeline','reps'];
  const idx=Array.from(document.querySelectorAll('.tab')).findIndex(el=>el.classList.contains('active'));
  switchTab(tabs[idx]||'dashboard');
}

function fmt(n){return'R '+Math.round(n).toLocaleString('en-ZA')}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function avStyle(i){const j=i%4;return`background:${AV_BG[j]};color:${AV_TX[j]}`}
function repNames(){return reps.map(r=>r.name)}
function repOpts(sel=''){return repNames().map(n=>`<option${n===sel?' selected':''}>${n}</option>`).join('')}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['dashboard','activity','pipeline','reps'][i]===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  updatePermUI();
  if(t==='dashboard')renderDashboard();
  if(t==='activity')renderActivity();
  if(t==='pipeline')renderPipeline();
  if(t==='reps')renderReps();
}

function updatePermUI(){
  const admin=isAdmin();
  const rln=document.getElementById('rep-lock-notice');
  const pln=document.getElementById('pipe-lock-notice');
  const arb=document.getElementById('add-rep-btn');
  if(rln)rln.style.display=admin?'none':'inline-flex';
  if(pln)pln.style.display=admin?'none':'inline-flex';
  if(arb)arb.style.display=admin?'':'none';
}

function renderDashboard(){
  const active=deals.filter(d=>d.status==='Active');
  const tp=active.reduce((s,d)=>s+d.value,0);
  const wt=active.reduce((s,d)=>s+d.value*d.prob/100,0);
  const won=deals.filter(d=>d.status==='Won').reduce((s,d)=>s+d.value,0);
  const pend=activities.filter(a=>a.followup==='Yes').length;
  const funnelStages=STAGES.filter(s=>s!=='Closed Won'&&s!=='Closed Lost');
  let fHtml='<div class="funnel">'+funnelStages.map(s=>{
    const ds=deals.filter(d=>d.stage===s);const v=ds.reduce((t,d)=>t+d.value,0);
    return`<div class="funnel-stage"><div class="funnel-label">${s}</div><div class="funnel-val">${ds.length}</div><div class="funnel-sub">${v?fmt(v):''}</div></div>`;
  }).join('')+'</div>';
  let h=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Active pipeline</div><div class="kpi-val">${fmt(tp)}</div></div>
    <div class="kpi"><div class="kpi-label">Weighted pipeline</div><div class="kpi-val">${fmt(Math.round(wt))}</div></div>
    <div class="kpi"><div class="kpi-label">Revenue won</div><div class="kpi-val">${fmt(won)}</div></div>
    <div class="kpi"><div class="kpi-label">Activities</div><div class="kpi-val">${activities.length}</div></div>
    <div class="kpi"><div class="kpi-label">Active reps</div><div class="kpi-val">${reps.length}</div></div>
    <div class="kpi"><div class="kpi-label">Follow-ups pending</div><div class="kpi-val">${pend}</div></div>
  </div><div class="section-hd">Pipeline funnel</div>${fHtml}<div class="two-col">
  <div><div class="section-hd">Pipeline by stage</div>`;
  h+=STAGES.map(s=>{const ds=deals.filter(d=>d.stage===s);const v=ds.reduce((t,d)=>t+d.value,0);
    return`<div class="stage-row"><span class="badge ${SC[s]||'b-gray'}" style="min-width:90px;text-align:center">${s}</span>
      <span style="font-size:12px;color:var(--text-secondary)">${ds.length} deal${ds.length!==1?'s':''}</span>
      <span style="margin-left:auto;font-size:12px;font-weight:500">${v?fmt(v):''}</span></div>`;}).join('');
  h+=`</div><div><div class="section-hd">Rep performance</div>`;
  h+=reps.map((r,i)=>{const acts=activities.filter(a=>a.rep===r.name).length;const pipe=deals.filter(d=>d.rep===r.name&&d.status==='Active').reduce((s,d)=>s+d.value,0);
    return`<div class="stage-row">
      <div class="avatar" style="${avStyle(i)};width:28px;height:28px;font-size:10px;font-weight:600">${initials(r.name)}</div>
      <span style="font-size:13px;font-weight:500">${r.name}</span>
      <span style="font-size:12px;color:var(--text-secondary);margin-left:4px">${acts} acts</span>
      <span style="margin-left:auto;font-size:12px;font-weight:500">${pipe?fmt(pipe):'—'}</span></div>`;}).join('');
  h+=`</div></div>`;
  document.getElementById('dash-content').innerHTML=h;
}

function populateFilters(){
  const names=repNames();
  ['act-rep','pipe-rep'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const cur=el.value;el.innerHTML='<option value="">All reps</option>'+names.map(n=>`<option${cur===n?' selected':''}>${n}</option>`).join('');});
  const at=document.getElementById('act-type');if(at)at.innerHTML='<option value="">All types</option>'+TYPES.map(t=>`<option>${t}</option>`).join('');
  const ps=document.getElementById('pipe-stage');if(ps)ps.innerHTML='<option value="">All stages</option>'+STAGES.map(s=>`<option>${s}</option>`).join('');
}

function renderActivity(){
  populateFilters();
  const q=(document.getElementById('act-search')?.value||'').toLowerCase();
  const rep=document.getElementById('act-rep')?.value||'';
  const type=document.getElementById('act-type')?.value||'';
  const f=activities.filter(a=>(!rep||a.rep===rep)&&(!type||a.type===type)&&(!q||[a.customer,a.company,a.purpose,a.outcome].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  const tb=document.getElementById('act-body');
  if(!f.length){tb.innerHTML=`<tr><td colspan="10"><div class="empty">No activities found</div></td></tr>`;return}
  tb.innerHTML=f.map(a=>`<tr>
    <td>${a.date}</td><td>${a.rep}</td><td>${a.customer}</td><td>${a.company}</td>
    <td><span class="badge b-blue">${a.type}</span></td>
    <td title="${a.purpose}">${a.purpose}</td><td style="text-align:center">${a.mins}</td>
    <td style="text-align:center"><span class="badge ${a.followup==='Yes'?'b-amber':'b-gray'}">${a.followup}</span></td>
    <td>${a.fudate||'—'}</td><td title="${a.outcome}">${a.outcome}</td></tr>`).join('');
}

function renderPipeline(){
  populateFilters();
  const q=(document.getElementById('pipe-search')?.value||'').toLowerCase();
  const rep=document.getElementById('pipe-rep')?.value||'';
  const stage=document.getElementById('pipe-stage')?.value||'';
  const f=deals.filter(d=>(!rep||d.rep===rep)&&(!stage||d.stage===stage)&&(!q||[d.customer,d.company,d.opportunity].join(' ').toLowerCase().includes(q)));
  const tb=document.getElementById('pipe-body');
  const admin=isAdmin();
  if(!f.length){tb.innerHTML=`<tr><td colspan="11"><div class="empty">No deals found</div></td></tr>`;}
  else tb.innerHTML=f.map(d=>`<tr>
    <td>${d.rep}</td><td>${d.customer}</td><td>${d.company}</td>
    <td title="${d.opportunity}">${d.opportunity}</td>
    <td><span class="badge ${SC[d.stage]||'b-gray'}">${d.stage}</span></td>
    <td style="text-align:right">${fmt(d.value)}</td>
    <td style="text-align:center">${d.prob}%</td>
    <td style="text-align:right">${fmt(Math.round(d.value*d.prob/100))}</td>
    <td>${d.close}</td>
    <td><span class="badge ${d.status==='Won'?'b-green':d.status==='Lost'?'b-coral':'b-blue'}">${d.status}</span></td>
    <td><button class="icon-btn del" onclick="openModal('deleteDeal',${d.id})" ${admin?'':'disabled'} title="${admin?'Delete deal':'Admin only'}"><i class="ti ti-trash"></i></button></td>
  </tr>`).join('');
  document.getElementById('pipe-total').textContent=fmt(f.reduce((s,d)=>s+d.value,0));
  document.getElementById('pipe-weighted').textContent=fmt(Math.round(f.reduce((s,d)=>s+d.value*d.prob/100,0)));
  document.getElementById('pipe-count').textContent=f.length;
}

function renderReps(){
  const admin=isAdmin();
  document.getElementById('add-rep-btn').style.display=admin?'':'none';
  document.getElementById('rep-lock-notice').style.display=admin?'none':'inline-flex';
  const q=(document.getElementById('rep-search')?.value||'').toLowerCase();
  const f=reps.filter(r=>!q||r.name.toLowerCase().includes(q)||r.territory.toLowerCase().includes(q));
  const grid=document.getElementById('rep-grid');
  if(!f.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1">No reps found</div>`;return}
  grid.innerHTML=f.map((r,i)=>{const acts=activities.filter(a=>a.rep===r.name).length;const pipe=deals.filter(d=>d.rep===r.name&&d.status==='Active').reduce((s,d)=>s+d.value,0);
    return`<div class="rep-card">
      <div class="avatar" style="${avStyle(i)}">${initials(r.name)}</div>
      <div class="rep-info">
        <div class="rep-name">${r.name}</div>
        <div class="rep-meta">${r.title}</div>
        <div class="rep-meta"><i class="ti ti-map-pin" style="font-size:12px"></i> ${r.territory}</div>
        <div class="rep-meta" style="margin-top:4px;display:flex;gap:10px">
          <span>${acts} activities</span>
          ${pipe?`<span style="color:var(--success-text);font-weight:500">${fmt(pipe)}</span>`:'<span>No active deals</span>'}
        </div>
      </div>
      <div class="rep-actions">
        <button class="icon-btn" onclick="openModal('editRep',${r.id})" ${admin?'':'disabled'} title="${admin?'Edit rep':'Admin only'}"><i class="ti ti-edit"></i></button>
        <button class="icon-btn del" onclick="openModal('deleteRep',${r.id})" ${admin?'':'disabled'} title="${admin?'Remove rep':'Admin only'}"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;}).join('');
}

function openModal(mode,id){
  modalMode=mode;targetId=id||null;
  const title=document.getElementById('modal-title');
  const body=document.getElementById('modal-body');
  const saveBtn=document.getElementById('modal-save-btn');
  saveBtn.className='btn primary';saveBtn.textContent='Save';
  if(mode==='rep'||mode==='editRep'){
    const r=mode==='editRep'?reps.find(x=>x.id===id):{};
    title.textContent=mode==='rep'?'Add rep':'Edit rep';
    body.innerHTML=`<div class="form-2">
      <div class="form-row"><label>Full name</label><input type="text" id="f-rname" value="${r.name||''}"></div>
      <div class="form-row"><label>Job title</label><input type="text" id="f-rtitle" value="${r.title||'External Sales Rep'}"></div>
    </div>
    <div class="form-row"><label>Territory / area</label><input type="text" id="f-rterritory" value="${r.territory||''}"></div>
    <div class="form-2">
      <div class="form-row"><label>Email</label><input type="email" id="f-remail" value="${r.email||''}"></div>
      <div class="form-row"><label>Phone</label><input type="text" id="f-rphone" value="${r.phone||''}"></div>
    </div>`;
  } else if(mode==='deleteRep'){
    const r=reps.find(x=>x.id===id);
    const ac=activities.filter(a=>a.rep===r.name).length;
    const dc=deals.filter(d=>d.rep===r.name).length;
    title.textContent='Remove rep';
    saveBtn.className='btn btn-danger';saveBtn.textContent='Yes, remove';
    body.innerHTML=`<div class="confirm-box"><i class="ti ti-alert-triangle"></i> Remove <strong>${r.name}</strong> from Blake Hydraulics? They have ${ac} activit${ac!==1?'ies':'y'} and ${dc} deal${dc!==1?'s':''} on record. Historical data stays intact.</div>`;
  } else if(mode==='deleteDeal'){
    const d=deals.find(x=>x.id===id);
    title.textContent='Delete deal';
    saveBtn.className='btn btn-danger';saveBtn.textContent='Yes, delete';
    body.innerHTML=`<div class="confirm-box"><i class="ti ti-alert-triangle"></i> Permanently delete <strong>${d.opportunity}</strong> for ${d.company} (${fmt(d.value)})? This cannot be undone.</div>`;
  } else if(mode==='activity'){
    title.textContent='Log activity';
    const dr=currentUser.role==='rep'?currentUser.name:'';
    body.innerHTML=`<div class="form-2">
      <div class="form-row"><label>Date</label><input type="date" id="f-date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label>Rep</label><select id="f-rep"><option value="">Select…</option>${repOpts(dr)}</select></div>
    </div>
    <div class="form-2">
      <div class="form-row"><label>Customer name</label><input type="text" id="f-cust"></div>
      <div class="form-row"><label>Company</label><input type="text" id="f-company"></div>
    </div>
    <div class="form-2">
      <div class="form-row"><label>Contact type</label><select id="f-type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="form-row"><label>Duration (mins)</label><input type="number" id="f-mins" value="30" min="1"></div>
    </div>
    <div class="form-row"><label>Purpose / agenda</label><input type="text" id="f-purpose"></div>
    <div class="form-row"><label>Outcome</label><textarea id="f-outcome"></textarea></div>
    <div class="form-2">
      <div class="form-row"><label>Follow-up required?</label><select id="f-fu"><option>No</option><option>Yes</option></select></div>
      <div class="form-row"><label>Follow-up date</label><input type="date" id="f-fudate"></div>
    </div>`;
  } else if(mode==='pipeline'){
    title.textContent='Add deal';
    const dr=currentUser.role==='rep'?currentUser.name:'';
    body.innerHTML=`<div class="form-2">
      <div class="form-row"><label>Rep</label><select id="f-rep"><option value="">Select…</option>${repOpts(dr)}</select></div>
      <div class="form-row"><label>Stage</label><select id="f-stage" onchange="autoProb(this.value)">${STAGES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    </div>
    <div class="form-2">
      <div class="form-row"><label>Customer name</label><input type="text" id="f-cust"></div>
      <div class="form-row"><label>Company</label><input type="text" id="f-company"></div>
    </div>
    <div class="form-row"><label>Opportunity / product</label><input type="text" id="f-opp"></div>
    <div class="form-2">
      <div class="form-row"><label>Deal value (R)</label><input type="number" id="f-value" min="0"></div>
      <div class="form-row"><label>Probability %</label><input type="number" id="f-prob" value="${DP['Qualified']}" min="0" max="100"></div>
    </div>
    <div class="form-2">
      <div class="form-row"><label>Expected close date</label><input type="date" id="f-close"></div>
      <div class="form-row"><label>Status</label><select id="f-status"><option>Active</option><option>Won</option><option>Lost</option></select></div>
    </div>`;
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function autoProb(s){const el=document.getElementById('f-prob');if(el&&DP[s]!==undefined)el.value=DP[s];}
function g(id){return document.getElementById(id)?.value||''}

function saveModal(){
  if(modalMode==='rep'){
    reps.push({id:nextRepId++,name:g('f-rname'),title:g('f-rtitle'),territory:g('f-rterritory'),email:g('f-remail'),phone:g('f-rphone')});
    closeModal();renderReps();
  } else if(modalMode==='editRep'){
    const r=reps.find(x=>x.id===targetId);
    if(r){const old=r.name;r.name=g('f-rname');r.title=g('f-rtitle');r.territory=g('f-rterritory');r.email=g('f-remail');r.phone=g('f-rphone');
      if(old!==r.name){activities.forEach(a=>{if(a.rep===old)a.rep=r.name});deals.forEach(d=>{if(d.rep===old)d.rep=r.name;})}}
    closeModal();renderReps();
  } else if(modalMode==='deleteRep'){
    reps=reps.filter(r=>r.id!==targetId);closeModal();renderReps();
  } else if(modalMode==='deleteDeal'){
    deals=deals.filter(d=>d.id!==targetId);closeModal();renderPipeline();
  } else if(modalMode==='activity'){
    activities.push({id:nextActId++,date:g('f-date'),rep:g('f-rep'),customer:g('f-cust'),company:g('f-company'),type:g('f-type'),purpose:g('f-purpose'),mins:parseInt(g('f-mins'))||0,followup:g('f-fu'),fudate:g('f-fudate'),outcome:g('f-outcome')});
    closeModal();renderActivity();
  } else if(modalMode==='pipeline'){
    deals.push({id:nextDealId++,rep:g('f-rep'),customer:g('f-cust'),company:g('f-company'),opportunity:g('f-opp'),stage:g('f-stage'),value:parseFloat(g('f-value'))||0,prob:parseFloat(g('f-prob'))||0,close:g('f-close'),status:g('f-status')});
    closeModal();renderPipeline();
  }
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function closeMO(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

renderDashboard();updatePermUI();
</script>
</body>
</html>
